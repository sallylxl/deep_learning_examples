---
apiVersion: v1
kind: Service
metadata:
  name: alan-deepseek-prefill-svc
  namespace: llm
spec:
  type: ClusterIP
  selector:
    leaderworkerset.sigs.k8s.io/name: alan-deepseek-prefill
    leaderworkerset.sigs.k8s.io/role: leader
  ports:
  - name: http
    protocol: TCP
    port: 30000
    targetPort: 30000
  - name: nixl-boot
    protocol: TCP
    port: 8998
    targetPort: 8998

---
apiVersion: v1
kind: Service
metadata:
  name: alan-deepseek-decode-svc
  namespace: llm
spec:
  type: ClusterIP
  selector:
    leaderworkerset.sigs.k8s.io/name: alan-deepseek-decode
    leaderworkerset.sigs.k8s.io/role: leader
  ports:
  - name: http
    protocol: TCP
    port: 30000
    targetPort: 30000
