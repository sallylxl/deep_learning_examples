apiVersion: apps/v1
kind: Deployment
metadata:
  name: deepseek-prefill
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: deepseek-prefill
  template:
    metadata:
      labels:
        app: deepseek-prefill
    spec:
      hostNetwork: true
      hostIPC: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        "scitix.ai/gpu-type": h20xnvlink141
        "roce.scitix.ai/unit": unit1
      containers:
        - name: sglang-prefill
          image: registry-cn-shanghai.siflow.cn/hisys/sglang:v0.5.1.post2-cu126
          securityContext:
            privileged: true
          command: ["/usr/bin/env", "bash", "-c"]
          args:
            - |
              set -euxo pipefail
              export POD_IP="$(hostname -i)"
              exec python3 -m sglang.launch_server \
                --host "0.0.0.0" \
                --port 30000 \
                --model-path /mnt/models/deepseek-ai/DeepSeek-V3.1-Base \
                --disaggregation-ib-device "mlx5_0,mlx5_1,mlx5_2,mlx5_3,mlx5_4,mlx5_5,mlx5_6,mlx5_7" \
                --chunked-prefill-size 20480 \
                --page-size 64 \
                --disable-radix-cache \
                --enable-deepep-moe \
                --deepep-mode normal \
                --disaggregation-mode prefill \
                --mem-fraction-static 0.85 \
                --context-length 32768 \
                --tp-size 8 \
                --trust-remote-code \
                --max-running-requests 1024 \
                --disaggregation-transfer-backend nixl
          env:
            - name: GLOO_SOCKET_IFNAME
              value: bond0
            - name: NCCL_SOCKET_IFNAME
              value: bond0
            - name: NCCL_IB_GID_INDEX
              value: "3"
            - name: NCCL_IB_QPS_PER_CONNECTION
              value: "8"
            - name: NCCL_NET_PLUGIN
              value: none
            - name: NCCL_MIN_NCHANNELS
              value: "4"
            - name: SGLANG_SET_CPU_AFFINITY
              value: "true"
            - name: SGL_ENABLE_JIT_DEEPGEMM
              value: "1"
          ports:
            - containerPort: 30000
            - containerPort: 8998
          readinessProbe:
            tcpSocket: { port: 30000 }
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            limits:
              nvidia.com/gpu: "8"
          volumeMounts:
            - { name: dshm, mountPath: /dev/shm }
            - { name: mnt, mountPath: /mnt }
      volumes:
        - name: dshm
          emptyDir: { medium: Memory }
        - name: mnt
          hostPath:
            path: /mnt/xstorage