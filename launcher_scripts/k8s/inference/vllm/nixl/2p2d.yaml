---
# Proxy
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-proxy
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-proxy
  template:
    metadata:
      labels:
        app: vllm-proxy
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      containers:
        - name: proxy
          image: registry-cn-shanghai.siflow.cn/hisys/pytorch:25.04-vllm
          command: ["/usr/bin/env", "bash", "-c"]
          args:
            - |
              python3 /data/vllm/toy_proxy_server.py \
                --port 8192 \
                --prefiller-port 8100 8101 \
                --decoder-port 8200 8201 &
              sleep inf
          volumeMounts:
            - name: everything
              mountPath: /data
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: everything
          hostPath:
            path: /mnt/xstorage
        - name: shm
          hostPath:
            path: /dev/shm
